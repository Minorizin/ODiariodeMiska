    <script>
        function openLink(url) {
            window.open(url, '_blank');
        }

        // Sistema de apresentação de slides
        let currentSlide = 0;
        const slides = document.querySelectorAll('.background-slideshow img');
        const slideInterval = 10000; // Muda a cada 10 segundos

        function changeSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(changeSlide, slideInterval);

        // Atualizar relógio
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            document.querySelector('.clock').textContent = `${hours}:${minutes} ${ampm}`;
        }

        updateClock();
        setInterval(updateClock, 60000);
    </script>
