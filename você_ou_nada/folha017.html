    <script>

        // Função de login
        function attemptLogin() {
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            const loginMessage = document.getElementById('loginMessage');
            const loginScreen = document.getElementById('loginScreen');
            const userName = document.getElementById('userName');
            
            if (username.length > 0 && password.length > 0) {
                userName.textContent = username;
                loginMessage.textContent = 'Bem-vindo...';
                loginMessage.style.color = '#90ee90';
                
                setTimeout(() => {
                    loginScreen.classList.add('hidden');
                    setTimeout(() => {
                        loginScreen.style.display = 'none';
                    }, 500);
                }, 800);
            } else if (username.length === 0) {
                loginMessage.textContent = 'Por favor, insira um nome de usuário.';
                loginMessage.style.color = '#ffcccc';
                
                const input = document.getElementById('usernameInput');
                input.style.animation = 'none';
                setTimeout(() => {
                    input.style.animation = 'shake 0.5s';
                }, 10);
            } else if (password.length === 0) {
                loginMessage.textContent = 'Por favor, insira uma senha.';
                loginMessage.style.color = '#ffcccc';
                
                const input = document.getElementById('passwordInput');
                input.style.animation = 'none';
                setTimeout(() => {
                    input.style.animation = 'shake 0.5s';
                }, 10);
            }
        }

        // Permitir login com Enter em ambos os campos
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('passwordInput').focus();
            }
        });

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                attemptLogin();
            }
        });

        // Adicionar animação de shake
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // Som de click do mouse
        function playClickSound() {
    const audio = new Audio('áudio/mouse-click.mp3');
    audio.volume = 0.6;
    audio.play();
}

        // Adicionar som de click em todos os cliques
        document.addEventListener('mousedown', function(e) {
            playClickSound();
        });

        // Som de digitação
        function playTypingSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Configurar som de tecla
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(200 + Math.random() * 100, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.03);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.03);
        }

        // Adicionar som de digitação nos campos
        document.getElementById('usernameInput').addEventListener('keydown', function(e) {
            playTypingSound();
        });

        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            playTypingSound();
        });

         // Dados dos programas
        const programs = {
            Admirador: {
                title: 'Admirador',
                icon: 'img/Admirador.ico',
                description: '17-01',
                warning: true,
                warningText: 'O que você está prestes a acessar contém conteúdo que pode perturbá-lo. Até mesmo chocá-lo. Continue por sua conta e risco.',
                info: 'Seria possível que alguém transgredisse todas as barreiras morais, que cometesse atos impensáveis apenas para conquistar sua aprovação?',
                link: 'https://drive.google.com/file/d/1f0BACJPtZeG_9fkdVMkWmrxI1yODGqHL/view?usp=drive_link',
                linkText: 'Baixar'
            },
            Secreto: {
                title: 'Secreto',
                icon: 'img/Secreto.png',
                description: '17-02',
                warning: true,
                warningText: 'O que você está prestes a acessar contém conteúdo que pode perturbá-lo. Até mesmo chocá-lo. Continue por sua conta e risco.',
                info: '... Mesmo nunca houvesse um rosto, uma voz, sequer um gesto concreto que denunciasse sua existência?',
                link: 'https://drive.google.com/file/d/1cyRsY7my57JrCbUDVxKFMrN4gGSSwtOu/view?usp=drive_link',
                linkText: 'Baixar'
            }
        };

        function openProgramWindow(programId) {
            const program = programs[programId];
            const overlay = document.getElementById('windowOverlay');
            const programWindow = document.getElementById('programWindow');
            const windowIcon = document.getElementById('windowIcon');
            const windowTitleText = document.getElementById('windowTitleText');
            const windowContent = document.getElementById('windowContent');

            // Reset position
            xOffset = 0;
            yOffset = 0;
            programWindow.style.transform = 'translate(0px, 0px)';

            windowIcon.src = program.icon;
            windowTitleText.textContent = program.title;
            
            let warningSection = '';
            if (program.warning) {
                warningSection = `
                    <div class="warning-box">
                        <div class="warning-title">⚠ Aviso!!</div>
                        <div class="warning-text">${program.warningText}</div>
                    </div>
                `;
            }

            windowContent.innerHTML = `
                <img src="${program.icon}" class="program-icon-large" alt="${program.title}">
                <p class="program-description">${program.description}</p>
                ${warningSection}
                <div class="program-info">
                    <div class="program-info-title">Sobre este programa:</div>
                    <p>${program.info}</p>
                </div>
                <div class="window-actions">
                    <button class="action-button primary" onclick="openLink('${program.link}')">
                        ${program.linkText}
                    </button>
                    <button class="action-button" onclick="closeWindow()">
                        Cancelar
                    </button>
                </div>
            `;

            overlay.classList.add('active');
        }

        function closeWindow() {
            document.getElementById('windowOverlay').classList.remove('active');
        }

        // Sistema para arrastar a janela
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        function dragStart(e) {
            const titlebar = e.target.closest('.window-titlebar');
            if (titlebar && !e.target.closest('.window-button')) {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
                isDragging = true;
            }
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                
                const window = document.getElementById('programWindow');
                window.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }
        }

        function dragEnd(e) {
            isDragging = false;
        }

        // Adicionar eventos de arrastar
        document.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        // Fechar ao clicar fora da janela (agora desabilitado já que não tem mais fundo escuro)
        // document.getElementById('windowOverlay').addEventListener('click', function(e) {
        //     if (e.target === this) {
        //         closeWindow();
        //     }
        // });

        function openLink(url) {
            window.open(url, '_blank');
            closeWindow();
        }

        // Sistema de apresentação de slides
        let currentSlide = 0;
        const slides = document.querySelectorAll('.background-slideshow img');
        const slideInterval = 10000; // Muda a cada 10 segundos

        function changeSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(changeSlide, slideInterval);

        // Atualizar relógio
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            document.querySelector('.clock').textContent = `${hours}:${minutes} ${ampm}`;
        }

        updateClock();
        setInterval(updateClock, 60000);
    </script>
