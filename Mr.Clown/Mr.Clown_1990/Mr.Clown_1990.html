          <p>A curiosidade é o que acaba matando o gato.</p>

          <p>Essa frase, repetida à exaustão em camisetas, memes e conselhos maternos, costuma soar inofensiva. Para muitos, não passa de um provérbio banal, desses que a gente escuta e ignora. Havia sido o que Charlotte tinha dito pros amigos idiotas dela. Estava alertando durante quase toda a viagem que eles não deveriam fazer aquilo, para dar meia volta. Mas eles optaram por não escutá-la.</p>

          <p>Agora, ali estavam. Diante de uma casa isolada, plantada no meio do nada como um erro geográfico. A construção erguia-se solitária, rodeada por um terreno irregular e uma vegetação que parecia ter desistido de crescer direito. Não havia vizinhos, iluminação adequada ou qualquer indício de vida nas redondezas. Apenas silêncio.</p>

          <p>Encostada no carro que os trouxera até aquele fim de mundo, Charlotte respirava fundo, tentando organizar a irritação que borbulhava sob a superfície. A viagem fora do tipo de desastre que faz qualquer pessoa reconsiderar suas amizades.</p>

          <p>Ela perdeu a conta de quantas quase-colisões presenciou. Tudo porque os três decidiram transformar o trajeto numa competição idiota de resistência ao bom senso. Em determinado momento, alguém achou engraçado obstruir deliberadamente a visão do motorista. Em outro, uma discussão banal escalou para empurrões e socos, tudo isso dentro de um veículo em movimento, numa estrada estreita e mal iluminada.</p>

          <p>Era o tipo de imprudência que flertava descaradamente com a tragédia.</p>

          <p>Para Charlotte, aquilo não era aventura, não era nada menos do que irresponsabilidade. Havia uma diferença clara entre buscar adrenalina e cortejar o desastre. Eles, ao que parecia, não distinguiam uma coisa da outra.</p>

          <p>— Ei, trevosa! — gritou Gregore,  soprando com força contra o rosto de Charlotte, espalhando sua franja de maneira propositalmente irritante, como fazia desde o ensino fundamental.</p>

          <p>Ela respondeu à provocação instintivamente, desferindo um soco certeiro no rosto de Gregore. O impacto foi direto o suficiente para fazê-lo cambalear alguns passos para trás, surpreso demais para manter o equilíbrio.</p>

          <p>— É Charlotte, e não me chama assim de novo.</p>

          <p>Ela ajeitou o cabelo com movimentos curtos e impacientes, desviando o olhar enquanto liberava um suspiro carregado de tensão.</p>

          <p>Gregore levou a mão ao rosto, massageando a área atingida com expressão falsamente ofendida. Em seguida, soltou uma gargalhada debochada e ergueu ambas as mãos em rendição exagerada.</p>

          <p>— Hahaha! Tá bom, estressadinha, você quem manda!</i>

          <p>Ele se levantou devagar, ainda rindo, como se a situação inteira fosse apenas mais um episódio da comédia particular que ele acreditava protagonizar.</p>

          <p>“Eu te mato...”, pensou Charlotte, semicerrando os olhos. O arrependimento pelo soco misturava-se à vontade de acertar outro.</p>

          <p>Respira.</p>

          <p>Respira direito.</p>

          <p>Inspira, segura, solta.</p>

          <p>“Se acalma, Charlotte…”, pensou, “ReeesspiiiiiraAaAaAa… Uuuf. Tá. Agora talvez eu esteja funcion-”</p>

          <p>— HEEEEY, SENHORIIITAAA! JÁ VAMOS ENTRAAAAAR! — berrou Andy à distância, com aquele tom zombeteiro que parecia ter sido geneticamente projetado para irritá-la.</p>

          <p>Michael e Andy permaneciam agrupados diante da porta principal, rindo e comentando algo entre si. Provavelmente sobre ela. Sobre sua “lerdeza”, como gostavam de chamar.</p>

          <p>Na perspectiva deles, Charlotte era dramática, excessivamente cautelosa e um pouco paranoica.</p>

          <p>Na perspectiva dela, porém, tratava-se de instinto de sobrevivência, habilidade essa que era subestimada por indivíduos que confundiam imprudência com coragem.</p>

          <p>Ela soltou um suspiro longo, em seguida, pôs-se a caminhar em direção à casa, com a convicção de aquilo era uma péssima ideia.</p>

          <p>À medida que se aproximava, permitiu-se observar a fachada com mais atenção. A construção exibia sinais evidentes de deterioração: tinta descascada, madeira empenada, vidros opacos pelo acúmulo de sujeira e tempo. O jardim, se é que ainda podia ser chamado assim, havia sido engolido por ervas daninhas que cresciam de maneira desordenada, como se disputassem território com o abandono.</p>

          <p>O odor que emanava da casa lembrava ácido e decomposição orgânica. Era a total representação de uma negligência prolongada, de anos sem circulação de ar ou presença humana.</p>

          <p>Charlotte balançou negativamente a cabeça, avaliando o conjunto com uma expressão que misturava desprezo e inquietação.</p>

          <p>— Essa casa fede a fezes. — começou Charlotte, cada sílaba carregada de impaciência. — Eu ainda me recuso a acreditar que vocês me trouxeram até esse fim de mundo por causa de uma lenda idiota que, aliás, pode muito bem ser falsa e—</p>

          <p>— Ownn, gente, olha só! Ela tá com medinho de entrarrrrr… — cantarolou Gregore, interrompendo-a com um sarcasmo infantil.</p>

          <p>Ele apertou uma das bochechas dela com a intimidade irritante de quem manipula um brinquedo de pelúcia. O gesto foi suficiente para fazer o rosto de Charlotte arder de raiva. Andy, já dobrado de tanto rir, resolveu imitar o amigo e apertou a outra bochecha.</p>

          <p>— Vocês sequer ouviram uma palavra do que eu disse, porra? — disparou ela, afastando-os com um movimento brusco das mãos.</p>

          <p>Os dois recuaram imediatamente, mais pela energia da ameaça do que pelo empurrão em si.</p>

          <p>— Desculpa, não tá dando pra ouvir ainda!  — Michael respondeu, teatralmente. — Sabe por quê? Porque eu tô muito ocupado abrindo essa porta e—</p>

          <p>Ele girou a maçaneta com confiança exagerada. A madeira rangeu, mas não cedeu. Com isso, o riso que sustentava sua frase morreu no meio do caminho. Michael franziu a testa e tentou novamente, agora com menos performance e mais empenho.</p>

          <p> — Uuuuhhh.. — murmurou, forçando a maçaneta para baixo com insistência.</p>

          <p>Nada.</p>

          <p>O silêncio que se seguiu foi breve, porém constrangedor.</p>

          <p>Charlotte cruzou os braços e soltou um bufar carregado de previsibilidade. Aquilo estava escrito desde o começo.</p>

          <p>— Ihhhh, tá trancada. — anunciou Michael, recompondo o sorriso aos poucos. — Parece que alguém vai ter que dar um jeitinho de entrar e abrir pra gente, né?</p>

          <p>Os três trocaram olhares cúmplices antes de direcionarem a atenção, em perfeita sincronia, para Charlotte.</p>

          <p>Charlotte, por sua vez, não disse absolutamente nada. Ela não precisava. pois já sabia exatamente o que estavam insinuando: que ela, por ser a “cautelosa” e a “dramática”, também seria a mais apta a fazer o trabalho sujo. Escalar uma janela. Forçar uma entrada. Arriscar-se primeiro. Sempre ela.</p>

          <p>Sem disposição para prolongar a discussão, afastou-se do trio com passos firmes. Se precisava se afastar deles por alguns minutos para preservar a própria sanidade, ótimo. Melhor vasculhar paredes podres do que continuar ouvindo piadas de quinta categoria.</p>

          <p>Ela começou a contornar a casa, analisando o perímetro com atenção. As tábuas externas exibiam rachaduras profundas; algumas janelas estavam protegidas por venezianas quebradas, outras tinham o vidro estilhaçado, mas bloqueado por madeira pregada do lado de dentro. O mato alto roçava suas pernas enquanto ela avançava.</p>

          <p>Depois de um longo período circundando e examinando, Charlotte encontrou, na lateral mais sombreada do terreno, um par de pequenas portas de madeira embutidas no solo. Estavam parcialmente ocultas pelo mato alto e pela ferrugem das dobradiças. A estrutura lembrava aquelas entradas antigas de porão, discretas, funcionais, feitas para quem já sabe onde pisa.</p>

          <p>Sem pensar duas vezes, ergueu uma das folhas com esforço e logo abriu as portas. Um sopro de ar frio escapou da abertura, atingindo-lhe o rosto com a intensidade de um aviso. Ainda assim, ela desceu.</p>

          <p>Charlotte esperava encontrar um compartimento em ruínas: infiltrações, teias de aranha, caixas abandonadas e o típico cenário de negligência prolongada. Tecnicamente, não estava errada. Mas o espaço revelava algo além disso.</p>

          <p>Não tratava-se de um porão,  mas sim de uma antiga câmara frigorífica.</p>

          <p>O ambiente era anormalmente frio, muito mais do que seria justificável apenas pela ausência de luz solar. O ar apresentava uma densidade desconfortável, saturado por umidade e por um odor acre que parecia impregnar as paredes. Havia prateleiras metálicas corroídas pelo tempo, caixas plásticas quebradas e engradados empilhados de maneira desordenada. Garrafas de uma marca de cerveja que Charlotte jamais tinha visto acumulavam-se num canto. Ferramentas enferrujadas, ganchos soltos e correntes pendiam do teto com uma estética perturbadora.</p>

          <p>— Que merda… — murmurou, levando a mão ao nariz na tentativa inútil de filtrar o cheiro. — Aqui dentro fede mais do que lá fora.</p>

          <p>Decidida a não permanecer ali mais do que o necessário, começou a procurar uma saída com urgência crescente. Seus passos ecoavam de maneira oca contra o piso de concreto, amplificando a própria respiração.</p>

          <p>Foi então que avistou uma escada metálica ao fundo, parcialmente escondida atrás de caixas empilhadas. Charlotte aproximou-se e ergueu o olhar.</p>

          <p>No topo, tinha uma porta que aparentemente conectava o compartimento ao interior da casa principal.</p>

          <p>— Graças a Deus. — sussurrou, aliviada, sentindo a tensão aliviar minimamente os ombros.</p>

          <p>Subiu os degraus com rapidez, cada passo reverberando pelo espaço fechado.</p>

          <p>Ela envolveu a maçaneta com a mão ainda fria do ambiente, girou-a com firmeza e empurrou a porta. A dobradiça emitiu um ruído arrastado antes de ceder. Ao atravessar o limiar, Charlotte sentiu alívio. Deixar aquele compartimento para trás parecia equivalente a sair debaixo d’água para finalmente respirar.</p>

          <p>Ela deu alguns passos cautelosos e permitiu que os olhos se ajustassem à penumbra do interior. À sua frente, abria-se um espaço que um dia provavelmente fora uma sala de estar. Agora, restava apenas a carcaça do que outrora desempenhara essa função doméstica.</p>

          <p>O estado de deterioração era evidente. As paredes apresentavam manchas extensas de umidade, o mofo desenhava padrões irregulares que se espalhavam como mapas orgânicos. O assoalho de madeira estava gasto, com tábuas empenadas e fissuras. Em certos pontos, buracos expunham a estrutura inferior; de um deles, baratas emergiam lentamente, explorando o ambiente.</p>

          <p>O conjunto de objetos espalhados pelo cômodo contribuía para a atmosfera de abandono: um abajur sem lâmpada, inclinado num canto como um sentinela inútil; um controle remoto com as pilhas corroídas, vestígio de um entretenimento que há muito deixara de existir; uma caneca vermelha, manchada e opaca, repousando sobre o que restava de uma mesa lateral. Nada ali parecia ter sido removido com intenção, apenas deixado para trás.</p>

          <p>Charlotte direcionou o olhar ao sofá. A estrutura estava quase irreconhecível. O estofado rasgado expunha a espuma interna, e a madeira parecia ter sido consumida por cupins ou outro tipo de infestação.</p>

          <p>— Lar doce lar, não é mesmo? — murmurou, com ironia explícita. — Combina bastante com o tal assassino.</p>

          <p>Então, três batidas bruscas ecoaram pela porta principal.</p>

          <p>O som reverberou pelo interior da casa, abrupto o suficiente para arrancá-la de seus pensamentos. Seu coração acelerou por reflexo. Era Michael, nitidamente irritado pelo tempo de espera.</p>

          <p>Charlotte fechou os olhos por um segundo. Ela havia se esquecido completamente deles. E, ao recordar, trouxe consigo uma frustração cômica.</p>

          <p>— Que chatice.. — murmurou para si mesma.</p>

          <p>As batidas vieram novamente, mais insistentes.</p>

          <p>— Qual foi, Charlotte? Abre essa porta logo! — a voz de Michael atravessou a madeira com impaciência explícita. — Tá no mundo da lua de novo, criatura?!</p>

          <p>Ela revirou os olhos. Em seguida, caminhou até a entrada principal e começou a destrancar a porta sem pronunciar uma única palavra. A tranca cedeu com um estalo seco, e ela puxou a porta para o lado, permitindo que os três invadissem o interior como se estivessem entrando num parque de diversões.</p>

          <p>— Até que enfim, viu? Demora do caralho! — ironizou Gregore, atravessando o limiar.</p>

          <p>Ele fungou o ar com força, como um cão farejador em treinamento, e fez uma careta imediata.</p>

          <p>— Ughhh… esse lugar fede.</p>

          <p>— Sério? Só percebeu agora, é? — retrucou Charlotte, cruzando os braços.</p>

          <p>— Não vem com essa! — rebateu ele, apontando para o chão como se estivesse apresentando um argumento jurídico. — O cheiro de fora é uma coisa! O de dentro é completamente diferente!</p>

          <p>— Que lógica é essa, seu bu—</p>

          <p>— Ahem! — interrompeu Michael, limpando a garganta de maneira forçada. — Será que as mocinhas poderiam parar de tagarelar e vir logo?</p>

          <p>Sem esperar resposta, ele seguiu em direção à sala de estar. Andy já estava ao seu lado, acompanhando-o com aquela empolgação típica de quem acredita estar prestes a protagonizar algo histórico.</p>

          <p>Charlotte e Gregore trocaram um olhar carregado de irritação mútua e, resmungando em uníssono, seguiram os dois.</p>

          <div class="section-break"><span>░ ░ ░</span></div>

          <p>Todos reuniram-se no centro da sala deteriorada. O piso rangeu sob o peso coletivo, como se protestasse contra a presença deles. Andy, então, puxou para frente uma mala metálica que até então passara despercebida. O objeto produziu um ruído áspero ao deslizar sobre a madeira gasta.</p>

          <p>Ele abriu um sorriso largo demais para a situação.</p>

          <p>— Seguinte, bichonas… — anunciou, com entusiasmo. — É hora do show!</p>

          <p>Charlotte e Gregore se inclinaram curiosos, tentando entender o que ele estava tramando daquela vez.</p>

          <p>Andy destravou a mala, e o que se mostrou foi algo.. excessivo até demais.</p>

          <p>Havia câmeras profissionais, com lentes intercambiáveis e microfones acoplados, claramente destinadas a registrar algo ou alguém. Um kit de primeiros socorros ocupava um compartimento lateral, organizado com zelo clínico. E, então, o que fez o ar parecer ainda mais pesado:</p>

          <p>Armas.</p>

          <p>Um taco de beisebol envolto por pregos enferrujados, transformado em instrumento de violência improvisada. Duas .44 Magnum repousavam lado a lado, pesadas, metálicas e carregadas até o limite. Não eram brinquedos, nem réplicas. Eram armas de verdade.</p>

          <p>A expressão de Charlotte transitou da curiosidade para a incredulidade absoluta. Ela levou a mão à testa, pressionando-a como se pudesse, fisicamente, impedir que aquilo estivesse acontecendo.</p>

          <p>— Pra que tudo isso, Andy?! — questionou Charlotte, se jogando contra a parede, esperando uma explicação que não fosse completa estupidez.</p>

          <p>— É muito simples, ué? Nós vamos usar as câmeras para registrar provas de que essa é a casa do Mr. Clown e que ele realmente mora aqui. Quanto ás armas? É simples, quando a gente encontrar ele... — Andy pegou uma das magnums e apontou para Charlotte. Ele fez um movimento brusco, ameaçando atirar com a arma. — BOOOOGYAHHH! A gente atira, pega o danado e sai daqui rico!</p>

          <p>— .. Rico? — perguntou Charlotte, mais confusa ainda.</p>

          <p>— Sim, Charlotte. Grana, dinheiro vivo. Tá desatenta? Não lê jornal? — retrucou Andy com a paciência de quem fala com uma criança. — Tão oferecendo uma grana alta pra quem pegar esse desgraçado! — Andy começou a mirar com sua arma para lugar nenhum. — Dez anos se passaram e ninguém conseguiu encontrar o infeliz. Ele deve se achar muuuuuito esperto, mas agora o jogo virou! — Ele tirou a trava de segurança da arma, encarando-a com um sorriso pretensioso.</p>

          <p>— Pffft! Só pode tar de brincadeira. — Charlotte retrucou. — Nem você sabe se esse cara existiu de verdade, te toca!</p>

          <p>— Ah, claro. A sabichona sabe de tudo, né? — rebateu Andy, cruzando os braços. — Então explica o desaparecimento das crianças. E das outras centenas de pessoas que sumiram sem deixar rastro?</p>

          <p>— Cara, duuuuh? — ela respondeu, batendo o pé no assoalho gasto. — É uma  lenda urbana! Pânico coletivo, sensacionalismo, entendeu? Escolhe o termo que preferir.</p>

          <p>Andy riu com desdém.</p>

          <p>— Jornais locais documentam isso o tempo todo, garota. Tá tentando negar o que tá na tua cara, sabia?</p>

          <p>Gregore e Michael permaneciam em silêncio, observando o embate como espectadores de um debate televisivo. Nenhum dos dois parecia disposto a intervir, talvez por diversão, talvez por indecisão.</p>

          <p>Charlotte descruzou os braços e deu um passo à frente.</p>

          <p>— Ah, tá. E você acredita em tudo que a mídia diz, não é? — retrucou, a voz agora mais firme. — Jornal não é sinônimo de verdade absoluta, idiota! São empresas, Andy. Pessoas com interesses, com falhas. Cê acha que eles tão preocupados com a verdade desse tal assassino ou com o lucro que isso vai dar? Quanto mais misterioso e macabro, melhor vende!</p>

          <p>Ela apontou para a arma na mão dele.</p>

          <p>— E agora você tá aqui, armado até os dentes porque leu uma manchete qualquer!</p>

          <p>Andy não rebateu.</p>

          <p>O corredor mergulhou num silêncio espesso. Nenhum deles parecia disposto a sustentar o debate por mais tempo. O rangido distante da estrutura e o leve estalar da madeira dilatando-se com a mudança de temperatura tornaram-se os únicos sons audíveis.</p>

          <p>Durante alguns minutos, ninguém falou nada.</p>

          <p>Foi então que o olhar de Charlotte deslizou novamente até a maleta metálica.</p>

          <p>Ela se aproximou sem pedir licença e, ao reconhecer um dos equipamentos, sentiu o maxilar enrijecer.</p>

          <p>— E isso aqui? — sua voz saiu baixa, mas afiada. — Essa câmera é minha! Quem te deu permissão pra pegar, seu merdinha?</p>

          <p>Ela agarrou o equipamento com firmeza, os dedos envolvendo o corpo da máquina como se temesse que ele pudesse escapar. Seus olhos, fixos em Andy, carregavam uma mistura de indignação e incredulidade.</p>

          <p>Ela não aguardou justificativa.</p>

          <p>Porque sabia que não haveria uma resposta satisfatória. No máximo, uma desculpa preguiçosa, algum “ah, eu ia devolver” jogado ao vento. Não valia o desgaste.</p>

          <p>Ela virou-se abruptamente, caminhou até a porta de saída e a abriu com força excessiva, o impacto reverberando pela casa.</p>

          <p>— .. Mulher temperada. — Andy comentou, forçando um tom de desdém.</p>

          <p>— Tá naqueles dias, certeza. — acrescentou Michael, com um sorriso tolo que antecedeu sua própria gargalhada.</p>

          <p>O riso dele ecoou pelo corredor, rapidamente acompanhado pelos outros dois. Do lado de fora, Charlotte ouviu cada palavra.</p>

          <p>A porta foi fechada com um estrondo que silenciou a algazarra por um segundo. Ela se apoiou contra a madeira, sentindo a vibração ainda percorrer suas costas. Inspirou profundamente, mas o ar parecia insuficiente.</p>

          <p>“Que inferno!”, pensou Charlotte, cerrando os olhos com força. “Eu odeio esses vermes! Eu odeio essa casa decrépita! Eu só me enfio em furada!”</p>

          <p>A gargalhada dos três atravessava a porta com nitidez irritante. Michael imitava o tom de voz dela; Gregore acrescentava comentários exagerados; Andy pontuava tudo com risadas altas demais. O eco das piadas sobre sua “explosão emocional” reverberava no ar noturno.</p>

          <p>Ela cerrou o punho até os nós dos dedos esbranquiçarem.</p>

          <p>— Quer saber? Que se fodam esses babacas. — murmurou, quase num voto solene. — O carro é meu mesmo, eu vou embora! Eles que se virem pra pedir carona no meio do nada!</p>

          <p>Charlotte, então, sem olhar para trás, começou a caminhar em direção ao veículo estacionado a alguns metros da casa. Seus passos eram largos e firmes; a raiva pulsava nas têmporas como uma segunda circulação sanguínea.</p>

          <p>Porém, quando ela chegou até o veículo, ela viu.</p>

          <p>— Não, não, não... — murmurou, desacelerando. — Não é possível.</p>

          <p>O carro estava destruído.</p>

          <p>Os vidros haviam sido estilhaçados; fragmentos espalhavam-se pelo chão como cristais de gelo. A lataria apresentava amassados profundos, como se tivesse sido atingida repetidamente com algum objeto pesado. Os pneus estavam completamente vazios, rasgados em pontos estratégicos. O retrovisor pendia por um fio de plástico.</p>

          <p>— QUEM FEZ ISSO?! — gritou, a voz rasgando o silêncio do terreno.</p>

          <p>Ela se aproximou, examinando os danos com tanta atenção que beirava o obsessivo. Tocou a lataria amassada; passou os dedos pelos cortes nos pneus; inclinou-se para observar o interior. Seus movimentos eram rápidos, desorganizados, mas guiados por uma necessidade urgente de encontrar sentido. As mãos de Charlotte começaram a tremer enquanto ela remexia os bancos, afastava pedaços de vidro, vasculhava o painel.</p>

          <p>Foi então que percebeu algo fora de lugar.</p>

          <p>No banco do motorista, parcialmente preso entre o assento e o console central, havia um papel amarrotado, sujo e úmido.</p>

          <p>Ela franziu o cenho.</p>

          <p>— O que é isso?</p>

          <p>Ela puxou o papel com cuidado, como se ele pudesse se desfazer ao toque. O material estava desgastado, as bordas irregulares. Manchas de sujeira e umidade borravam a tinta, tornando a leitura difícil. Ainda assim, as palavras permaneciam discerníveis o bastante para serem compreendidas.</p>

          <br><br>
          <br><br>

          <p>Charlotte soltou um suspiro longo e levou a mão ao rosto, pressionando a testa e tentando reorganizar os próprios pensamentos à força. Ela balançou a cabeça devagar, numa tentativa de conferir se ainda estava ancorada na realidade ou se tudo aquilo não passava de um delírio provocado por estresse acumulado, noites mal dormidas e excesso de irritação.</p>

          <p>Infelizmente, era real.</p>

          <p>O carro continuava destruído e o papel permanecia em sua mão.</p>

          <p>— Isso deve ser coisa daqueles três idiotas. — disse Charlotte, apertando o papel com mais força do que deveria. — Claro, né? Isso é a cara deles. Eu mereço.</p>

          <p>A hipótese parecia confortável: uma pegadinha de péssimo gosto, uma tentativa de assustá-la para compensar o próprio orgulho ferido. Era o tipo de coisa que eles fariam.</p>

          <p>Charlotte tirou os olhos do papel e focou mais ao seu redor. O horizonte já estava engolido por tons azulados e roxos. O sol desaparecia atrás da linha de árvores, e a noite avançava com rapidez. As sombras se alongavam pelo terreno irregular, deformando contornos, tornando cada objeto potencialmente ameaçador.</p>

          <p>Charlotte inspirou fundo, guardou o papel na mão fechada e girou nos calcanhares. Ela caminhou com passos firmes até a casa e empurrou a porta. A madeira bateu contra a parede interna com um ruído seco. Michael, Gregore e Andy continuavam agrupados na sala, rindo alto demais, trocando comentários de duplo sentido e piadas constrangedoras que pareciam competir em vulgaridade.</p>

          <p>Desta vez, porém, Charlotte não reagiu com explosão. Ela simplesmente parou.</p>

          <p>Ficou imóvel no centro do cômodo, os ombros rígidos, o olhar fixo nos três. Aos poucos, as risadas diminuíram. E então, ela ergueu o papel amarrotado, segurando-o entre os dedos como evidência de um crime.</p>

          <p>— Eu acho melhor vocês terem uma boa explicação. — declarou, a voz baixa e controlada, o que a tornava ainda mais ameaçadora.</p>

          <p>Os três se entreolharam, e a expressão brincalhona que antes dominava seus rostos foi substituída por confusão genuína.</p>

          <div class="section-break"><span>░ ░ ░</span></div>

          <p>— Eu já falei que a gente não fez isso, cara! — Andy explodiu, a voz oscilando entre indignação e algo que soava perigosamente próximo do desespero.</p>

          <p>Para Charlotte, no entanto, a intensidade não ajudava. Pelo contrário: quanto mais ele elevava o tom, mais ela desconfiava. Havia uma linha tênue entre inocência revoltada e encenação mal ensaiada e, naquele momento, ela não estava disposta a conceder o benefício da dúvida.</p>

          <p>A discussão se estendeu por uma hora e meia.</p>

          <p>Uma hora e meia de argumentos sobrepostos, justificativas atropeladas e tentativas de reconstruir cada passo desde que haviam chegado. Michael insistia na lógica; Gregore apelava para o bom senso; Andy alternava entre indignação e ironia defensiva. Reviraram a mala, mostraram mensagens antigas, lembraram conversas do trajeto, tudo na tentativa de provar que não tinham destruído o carro nem deixado bilhete algum.</p>

          <p>Mas nada foi o suficiente. Charlotte permanecia rígida, os braços cruzados, a descrença estampada no rosto.</p>

          <p>— Admito que você atua muito bem pra um mentiroso. — comentou ela, lançando um olhar cortante para Andy. — Qualquer um cairia direitinho nessa performance.</p>

          <p>— Charlotte, que tal começar a pensar um pouco? — interveio Gregore, já exausto. — Por qual motivo a gente destruiria o próprio meio de transporte? A gente tá no meio do nada!</p>

          <p>— E tem mais! — acrescentou Michael, segurando o papel pelas bordas como se fosse tóxico. — Isso aqui cheira a vômito. Por que a gente escreveria numa coisa dessas? E essa letra não é de nenhum de nós. Não bate.</p>

          <p>— Talvez seja porque eu já passei por experiências parecidas com vocês três. Já pensou nisso? — respondeu Charlotte, forçando um sorriso tenso. — Perdi a conta de quantas vezes tive que me estressar por causa de vocês.</p>

          <p>— Charlotte, para com isso, cara.. — tentou Michael, a voz agora mais baixa.</p>

          <p>Mas ela simplesmente passou pelos três, caminhando pela casa sem direção definida.</p>

          <p>— E agora olha só.. — continuou, enquanto avançava pelo corredor estreito — Eu tô presa nessa espelunca por culpa de vocês, de novo. Que conveniente, não é?</p>

          <p>O piso rangia sob seus passos, cada estalo ecoando de maneira exagerada. A escuridão já dominava completamente o interior; a luz natural que antes filtrava pelas janelas quase não existia mais. O ambiente parecia menor, mais fechado, como se as paredes tivessem se aproximado alguns centímetros.</p>

          <p>Enquanto andava, acabou se deparando com uma porta que ainda não havia notado. Parou diante dela por um instante, analisando-a.</p>

          <p>Sem dizer nada, girou a maçaneta.</p>

          <p>A porta se abriu, revelando um interior mergulhado em quase completa escuridão. Era possível perceber alguns lampejos de luz mais abaixo, fracos e distantes, mas suficientes para indicar que o espaço se estendia para além do que seus olhos conseguiam distinguir naquele primeiro momento.</p>

          <p>— Maravilha, viu..?  — resmungou Charlotte, com evidente impaciência, enquanto colocava o pé no primeiro degrau e começava a descer a escada.</p>

          <p>— Pra onde é que cê tá indo? — perguntou Michael, aproximando-se alguns centímetros da entrada, mas sem coragem de avançar.</p>

          <p>— Vou ver se eu acho alguma coisa pra consertar o carro, né? — respondeu ela, sem olhar para trás. — Ferramenta, macaco, qualquer coisa minimamente útil.</p>

          <p>— A gente tá na casa de um assassino, Charlotte! — advertiu Gregore, a voz carregada de apreensão. — Sabe-se lá o que pode ter aí embaixo!</p>

          <p>Ela soltou uma risada breve, mais irritada do que divertida.</p>

          <p>— Eu já falei que não existe assassino nenhum, animal. Pelo amor de Deus. — retrucou, descendo mais alguns degraus. — O que existe aqui é um bando de marmanjos com mentalidade de gente de 15 e que acredita em qualquer história mal contada!</p>

          <div class="section-break"><span>░ ░ ░</span></div>

          <p>Quando Charlotte adentrou aquele cômodo desconhecido, levou apenas alguns segundos para compreender onde estava: era o porão da casa, relegado ao abandono e à decomposição lenta do tempo, o que já não era surpresa considerando o que já viu até então. O ar, saturado por um odor ácido e metálico, investiu contra suas narinas com a violência de um golpe.</p>

          <p>A escuridão parecia possuir densidade própria, rompida apenas por tênues fendas de luminosidade que atravessavam alguma rachadura no alto. A cena era desoladora. Camadas de sujeira aderiam às superfícies como uma segunda pele, móveis quebrados jaziam espalhados sem critério, montes de entulho acumulavam-se nos cantos, formando pequenas muralhas de indiferença. Também era possível ver alguns roedores e insetos, silenciosos, atentos, reivindicando aquele território como seu.</p>

          <p>— Ugh… — murmurou, comprimindo o rosto em repulsa. — Isso parece mais um esgoto do que pra porão.</p>

          <p>Ela avançou com cautela, medindo cada passo para não pisar em algo indecifrável. O odor de decomposição misturado ao gosto metálico da ferrugem parecia aderir à sua garganta, mas ela tentou ignorar. Concentrou-se na tarefa.</p>

          <p>Abriu gavetas emperradas, remexeu em armários tombados, afastou cadeiras partidas. Mas não havia absolutamente nada de valor ou utilidade. O espaço configurava-se como um labirinto de objetos descartados, quinquilharias, e lembranças esquecidas.</p>

          <p>Charlotte adiante até alcançar um compartimento que, pela disposição dos encanamentos e pela presença de azulejos manchados, devia ter sido uma antiga área de serviço. O mofo desenhava arabescos escuros pelas paredes; a poeira formava uma película espessa sobre cada superfície; no canto, uma máquina de lavar antiga permanecia imóvel, ao menos à primeira vista. No chão, roupas encardidas estavam espalhadas de modo irregular, torcidas, amassadas, como se tivessem sido arrancadas às pressas e abandonadas sem qualquer cuidado.</p>

          <p>Então ela percebeu.</p>

          <p>A máquina estava ligada.</p>

          <p>O ruído era constante, um zumbido grave e irritante que vibrava no interior das paredes e reverberava no assoalho.</p>

          <p>Charlotte franziu o cenho. Em um ambiente esquecido como aquele, o fato de algo continuar operando era surpreendente.</p>

          <p>Ela se aproximou da máquina, sentindo o assoalho ranger sob o próprio peso. Ela estendeu a mão e, após um breve instante de hesitação, pressionou o botão de desligar.</p>

          <p>O zumbido cessou abruptamente.</p>

          <p>A vibração que antes preenchia o ambiente desapareceu, deixando para trás o eco irregular da respiração de Charlotte e o distante estalar das tubulações nas paredes. Sem o ruído contínuo da máquina, o porão parecia ainda mais atento.</p>

          <p>Ela inclinou levemente o tronco, estreitando os olhos para enxergar através do vidro embaçado da tampa.</p>

          <p>— Espera.. o que que é isso dentro? — murmurou.</p>

          <p>Tinha algo no interior do tambor.</p>

          <p>Não eram apenas roupas girando em água turva. A forma era irregular, pesada demais para tecido comum, imóvel agora que o mecanismo cessara. A iluminação precária não ajudava; sombras distorciam contornos, sugerindo mais do que revelando.</p>

          <p>Charlotte abriu a máquina.</p>

          <p>Seus olhos se dilataram e o ar pareceu abandonar seus pulmões.</p>

          <p>— .. Meu Deus.</p>

          <div class="section-break"><span>░ ░ ░</span></div>

          <p>Michael, Andy e Gregore permaneceram encostados no mesmo canto da sala, mantendo a porta do porão sob vigilância. A princípio, o atraso de Charlotte pareceu trivial, alguns minutos a mais, talvez uma inspeção mais cuidadosa do que o previsto. Contudo, o tempo começou a adquirir densidade. Cinco minutos tornaram-se dez. Dez converteram-se em vinte. E ela não retornou.</p>

          <p>O silêncio prolongado instaurou uma tensão difícil de ignorar.</p>

          <p>— Já se passaram 20 minutos e até agora nada. — observou Gregore, consultando o relógio, impaciente. — Acho que aconteceu alguma coisa.</p>

          <p>Andy soltou uma risada curta, carregada de ironia.</p>

          <p>— Aconteceu o quê? — rebateu. — Ela disse que não existia nenhum assassino, não é mesmo? Vai ver desceu lá, percebeu que falou merda e agora tá apenas refletindo.</p>

          <p>Michael cruzou os braços, apoiando o peso do corpo contra a parede. Seus olhos percorriam o ambiente, atentos, como se qualquer sombra pudesse se deslocar a qualquer instante.</p>

          <p>— Confesso que eu daria risada disso. — respondeu, em tom baixo — Se a gente não tivesse preso nessa casa também. A situação não tá exatamente favorável.</p>

          <p>Andy revirou os olhos, estalando a língua contra o céu da boca.</p>

          <p>— Iiiihh, cês tão com medinho agora, é? — provocou. — A gente tá armado até o osso, eu hein!</p>

          <p>— Então eu acho que você pode descer lá, não é? — sugeriu Gregore, apontando para a porta do porão com o indicador.</p>

          <p>— Nem fodendo que eu desço ali! — respondeu por fim, rápido demais. — Eu não quero virar hambúrguer, não!</p>

          <p>Michael e Gregore trocaram um olhar silencioso que dispensava palavras, como se questionassem silenciosamente se aquela contradição era algum tipo de piada ou algo realmente sério.</p>

          <p>— .. Que foi? — perguntou Andy, com uma expressão pueril, como se realmente não compreendesse o peso do silêncio que se instalara.</p>

          <p>Michael expirou longamente. Passou a mão pelo rosto, tentando afastar o pressentimento incômodo que começava a ganhar forma.</p>

          <p>— Ai, ai, desgraça dos infernos, viu? — murmurou, balançando a cabeça. — Tá bom. Já que ninguém quer pagar pra ver, vamos resolver isso no pedra, papel ou tesoura. Fechado?</p>

          <p>A proposta, embora absurda diante da gravidade da situação, foi aceita sem resistência. Talvez porque nenhum deles desejasse assumir a responsabilidade da escolha. Talvez porque transformar o medo em jogo fosse mais suportável do que encará-lo diretamente.</p>

          <p>Eles formaram um círculo improvisado, mãos erguidas à altura do peito. A tensão, curiosamente, deu lugar a uma concentração quase solene.</p>

          <i>“Pedra!”</i>

          <i>“Papel!”</i>

          <i>“Tesoura!”</i>

          <p>Os gestos se revelaram simultaneamente.</p>

          <p>Michael escolheu Tesoura.</p>

          <p>Andy escolheu Pedra.</p>

          <p>Gregore escolheu Pedra também.</p>

          <p>Michael perdeu.</p>

          <p>— Eu nunca ganho nesse jogo maldito! — resmungou Michael, cerrando os dentes, enquanto os outros dois esboçavam sorrisos de alívio mal disfarçado.</p>

          <p>Sem alternativa, ele se dirigiu à porta do porão. Ao alcançar o topo da escada, lançou um último olhar para os colegas, que já zombavam às suas costas, rindo com aquele humor nervoso típico de quem não pretende descer junto.</p>

          <p>Ele desceu.</p>

          <div class="section-break"><span>░ ░ ░</span></div>

          <p>À medida que descia, a luminosidade rareava, engolida por uma penumbra espessa. O ar agora estava impregnado pelo seu odor pútrido característico, que forçou Michael a enrugar o nariz.</p>

          <p>— Que fedor! — disse Michael, colocando uma das mãos no nariz. — Não acredito que eu tô fazendo isso.</p>

          <p>Guiando-se pelas tênues luzes que mal iluminam o local, ele avançou com cautela, tateando o ambiente com o olhar antes de mover os pés. Contudo, ele acabou por tropeçar em alguns objetos dispersos pelo chão.</p>

          <p>— Nghh! Porra! Que droga! — praguejou entre dentes. </p>

          <p>Recuperando o equilíbrio, ele ergueu a voz, tentando mascarar a própria apreensão com irritação.</p>

          <p>— Charlotte! — gritou, o som reverberando nas paredes úmidas. — CADÊ VOCÊ?! TÁ DEMORANDO TEM UM TEMPINHO JÁ, NÃO ACHA NÃO?</p>

          <p>Não houve resposta alguma.</p>

          <p>— É sério! Aparece logo, vai! — berrou outra vez, agora sem qualquer traço de ironia, apenas irritação crua. — Eu já não tô aguentando ficar nesse lugar, é o cúmulo da imundice isso aqui!</p>

          <p>A própria voz pareceu pequena diante da vastidão escura do porão. O eco retornou fragmentado, dissolvendo-se nas paredes úmidas.</p>

          <p>Então ele ouviu.</p>

          <p>Um ruído distante, algo que poderia ser fruto da imaginação tensionada. Mas não era.</p>

          <p>Passos rápidos e irregulares, vindos de um corredor adjacente. O som aproximou-se com nitidez crescente, sapatos chocando-se contra o piso de concreto, até cessar abruptamente. Logo em seguida, um estrondo seco irrompeu no espaço: uma porta batendo com violência suficiente para fazer o ar vibrar.</p>

          <p>Michael sobressaltou-se, o corpo reagindo antes do pensamento. O coração disparou, e por um instante ele precisou apoiar-se na parede para não perder o equilíbrio.</p>

          <p>Ele conhecia os clichês. Tinha visto filmes suficientes para saber que gritar um “Tem alguém aí?” seria a decisão mais estúpida possível. Então, em vez de anunciar sua presença, optou por avançar com cautela. </p>

          <p>Ajustou a respiração, tentando silenciar o próprio corpo. Cada passo era calculado, evitando entulhos e superfícies instáveis. O corredor conduziu-o a uma antiga lavanderia, e o que encontrou ali fez o seu mundo perder momentaneamente a coerência.</p>

          <p>Charlotte estava suspensa por um daqueles ganchos.</p>

          <p>Seu corpo pendia de forma antinatural, marcado por ferimentos profundos. O rosto encontrava-se desfigurado a ponto de quase anular seus traços reconhecíveis. Sangue, já escurecido, contrastava com o metal oxidado. Era uma cena meticulosamente cruel.</p>

          <p>O estômago de Michael contraiu-se violentamente e um gosto ácido subiu-lhe pela garganta.</p>

          <p>— Que porra é essa?! — explodiu, desviando o olhar numa tentativa inútil de negar o que via. Deu alguns passos para trás, a respiração tornando-se irregular. — Eu tenho que sair daqui!</p>

          <p>Ele girou sobre os calcanhares e disparou pelo corredor, já sem preocupação com discrição. Ombros chocavam-se contra móveis abandonados; pés escorregavam em detritos; objetos caíam ao chão, ampliando o caos sonoro. Não importava. Ele apenas queria alcançar a saída. E, ao avistar uma porta que conduzia a um cômodo mais afastado, lançou-se contra ela.</p>

          <p>Ele agarrou a maçaneta e girou-a com força. Mas a porta não abriu.</p>

          <p>Tentou novamente, com mais desespero. O metal vibrou sob sua pressão, mas a fechadura ainda assim não cedeu.</p>

          <p>A porta estava trancada.</p>

          <p>— AAAAAANDY! — o grito irrompeu áspero, quase rasgando-lhe a garganta, enquanto ele esmurrava a porta com os punhos cerrados. — GREGOOOOOOOOOOOOORE!</p>

          <p>A madeira absorveu o impacto sem ceder. Ele se lançou contra ela com o ombro, sentindo a estrutura vibrar, mas a fechadura permaneceu inabalável. O som das pancadas ecoou pelo corredor e morreu na distância.</p>

          <p>Andy e Gregore estavam longe, talvez ainda explorando a casa, talvez discutindo teorias idiotas no andar de cima. Talvez rindo. A possibilidade de que não tivessem ouvido era plausível. A de que não pudessem ouvir, ainda pior.</p>

          <p>Michael desferiu um último soco contra a superfície rígida, mais por frustração do que por esperança. A dor reverberou pelos ossos da mão. O suor escorria por sua testa, misturando-se ao ar pesado do ambiente. Ofegava, o peito subindo e descendo com violência, consciente da inutilidade do esforço.</p>

          <p>Foi então que ele sentiu. Não foi um som, mas sim uma presença que modificava a atmosfera ao seu redor de forma que poderia ser imperceptível para alguns, mas que, para Michael, não foi.</p>

          <p>Ele se virou.</p>

          <p>E o viu.</p>

          <p>Ali, emergindo gradualmente da penumbra, estava Mr. Clown.</p>

          <p>Ele ostentava seu traje amarelo com listras vermelhas, outrora vibrante, encontrava-se agora maculado por manchas escuras de sangue seco, que endureciam o tecido. O chapéu verde, adornado com detalhes escarlates, repousava inclinado sobre a cabeça. As botas rubras, de pontas exageradamente largas e ornamentos esverdeados, carregavam uma ironia grotesca.</p>

          <p>A máscara, porém, concentrava o verdadeiro horror. Gasta pelo tempo, rachada em alguns pontos, exibia um sorriso permanente e distorcido, cuja curvatura parecia zombar da própria ideia de um sorriso humano comum. Os olhos, ocultos sob a sombra da cavidade, eram dois abismos indecifráveis.</p>

          <p>As histórias sussurradas ao longo dos anos, tratadas como exageros ou delírios coletivos, materializavam-se ali, diante dele.</p>

          <p>Não havia mais espaço para lendas urbanas, apenas a concretude.</p>

          <div class="horror-line">M R . &nbsp; C L O W N &nbsp; E S T A V A &nbsp; D E &nbsp; V O L T A .</div>

          <p>Michael não teve sequer o intervalo de um segundo para reagir.</p>

          <p>Ele avançou com uma rapidez incompatível com o figurino grotesco que vestia. Sua mão surgiu da sombra e fechou-se ao redor do pescoço de Michael com violência calculada. Os dedos fortes, firmes e inescapáveis comprimiram-lhe a traqueia antes que qualquer instinto de defesa pudesse se organizar.</p>

          <p>Seus pés deixaram o chão.</p>

          <p>Seu corpo foi erguido como se não tivesse peso. Michael agarrou o braço do palhaço, suas unhas cravando-se no tecido manchado, tentando criar espaço para respirar. Mas foi inútil. A pressão aumentava de maneira progressiva e o ar transformou-se em um luxo inalcançável.</p>
          
          <p>Sua visão começou a falhar.</p>

          <p>Primeiro, as bordas do campo visual escureceram. Depois, tudo adquiriu contornos imprecisos, como se o mundo estivesse sendo dissolvido em água suja. Seus ouvidos captavam apenas um zumbido grave, intercalado pelo riso abafado e distorcido de Mr. Clowm, uma gargalhada baixa e íntima, que vibrava contra sua pele.</p>

          <p>O rosto de Michael inchava sob o esforço desesperado por oxigênio. Vasos rompidos tingiam seus olhos de vermelho. Espuma acumulava-se no canto de sua boca. E as suas mãos, antes violentas na tentativa de resistência, tornavam-se progressivamente fracas.</p>

          <p>O riso ecoava.</p>

          <p>E o mundo desbotava.</p>

          <p>O estampido rasgou o espaço.</p>

          <i style="color: rgb(134, 4, 4);">BANG!</i>

          <p>Cinco disparos atravessaram o corpo de Mr. Clown. Três atingiram o tórax, fazendo o tecido amarelo florescer em novas manchas rubras. Dois alcançaram a cabeça, rompendo a máscara numa explosão de fragmentos e matéria indistinta.</p>

          <p>A mão que sustentava Michael afrouxou e ele caiu no chão de forma desajeitada, arfando. O palhaço cambaleou um passo à frente, como se o corpo ainda tentasse obedecer a um comando que já não existia. Em um reflexo final, ele tentou estender o braço na direção de Michael com seus dedos tremendo no vazio, numa tentativa inútil de ainda reivindicar a presa.</p>

          <p>Porém, ele não conseguiu. Seus joelhos cederam, e seu corpo tombou como um peso morto sobre o concreto úmido.</p>

          <p>Sua respiração cessou.</p>

          <p>Seu coração silenciou.</p>

          <p>A imobilidade instalou-se.</p>

          <p>Morto.</p>

          <p>Por alguns segundos, apenas o odor de pólvora queimada competia com o cheiro pútrido do porão.</p>

          <p>Andy surgiu na entrada do corredor com a arma ainda erguida e a expressão surpreendentemente estável. Em seguida, inclinou levemente o revólver e soprou a fumaça que se desprendia do cano.</p>

          <p>— Acabou pra você, filho da puta! — gritou Andy, agora imóvel, observando a queda do assassino. Gregore, mais preocupado com a integridade de Michael, correu em sua direção e o ajudou a se levantar. </p>

          <p>Andy aproximou-se do corpo estendido no chão. Em seguida, ele parou a poucos passos da figura inerte, ergueu novamente a arma e apontou diretamente para a cabeça de Mr. Clown.</p>

          <p>— Hah. Tá achando que eu sou idiota, é? — murmurou.</p>

          <p>Sem aguardar qualquer sinal, Andy pressionou o gatilho repetidas vezes. A munição restante foi despejada quase integralmente no crânio já destroçado. Fragmentos da máscara se dispersaram, misturados a sangue que escorria com abundância, formando uma poça espessa ao redor da cabeça.</p>

          <p>— Finalize o desgraçado enquanto ainda há tempo, regra básica dos filmes de terror. — declarou, com um meio sorriso rígido.</p>

          <p>Após isso, Andy largou a arma no chão e, em seguida, andou na direção dos dois. Michael permanecia curvado, apoiado nas próprias coxas, tossindo de maneira irregular enquanto tentava normalizar a respiração. Seu pescoço exibia marcas avermelhadas que começavam a ganhar tonalidade roxa. Seus olhos estavam congestionados, vasos rompidos desenhando linhas escarlates na sua esclera.</p>

          <p>— Cara, teus olhos tão vermelhos que só o inferno! — comentou Gregore, com uma preocupação genuína tanto no tom quanto no olhar.</p>

          <p>Michael ergueu o olhar com dificuldade, ainda trêmulo.</p>

          <p>— Eu achei que minha cabeça fosse estourar. — confessou Michael com a voz rouca. — Sério, obrigado. Muito obrigado, de verdade. Eu devo uma enorme pra vocês.</p>

          <p>— É, tenta agradecer quando a gente sair daqui cheio da grana com esse cara e—</p>

          <p>— Espera. E a Charlotte? — interrompeu Gregore abruptamente.</p>

          <p>Andy calou-se imediatamente.</p>

          <p>Michael não respondeu. O agradecimento que ainda ecoava em sua garganta perdeu o sentido. Ele baixou a cabeça, evitando qualquer contato visual. A memória da lavanderia, do gancho, e, principalmente, do corpo de Charlotte suspenso impôs-se em sua cabeça com uma clareza cruel. Gregore e Andy compreenderam imediatamente, sem qualquer necessidade de explicações. A ausência de palavras dizia o suficiente. A euforia da sobrevivência dissipou-se, substituída por um peso esmagador.</p>

          <p>— Eu devia ter impedido ela. — disse Michael, com um tom tímido e quase choroso. </p>

          <p>— Michael, não é sua culpa. — Gregore disse, colocando uma mão no ombro de Michael para tentar o confortar de alguma forma.</p>

          <p>— É, pois é. Não é — disse Michael, retirando a mão de Gregore do ombro dele. — É de todos nós. Se a gente tivesse escutado ela e simplesmente dado meia-volta, nada disso aconteceria.</p>

          <p>— Qual é, cara..? — tentou dizer Andy, mas ele não sabia bem o que argumentar, não sabia nem se seria correto o fazer.</p>

          <p>— Não, só.. — Michael fez uma breve pausa, tentando organizar as palavras. — Só vamos logo embora desse lugar.</p>

          <p>Ele se virou sem esperar resposta e começou a se afastar. Gregore e Andy trocaram um olhar rápido e o seguiram quase imediatamente. Os três subiram as escadas apressados, buscando retornar para o interior da casa.</p>

          <p>— Precisamos tratar essas feridas no seu pescoço. A parada tá feia, acho que deixei o kit de primeiro socorros na sal—</p>

          <p>Andy abriu a porta do porão. No momento em que estavam prestes a cruzar o limiar, Gregore deu mais um passo à frente e acabou puxando uma corda preta, esticada de um jeito suspeitamente preciso, como se tivesse sido colocada ali de propósito. O tranco foi tão forte que a corda se partiu, fazendo Gregore quase perder o equilíbrio.</p>

          <p>— A-ai! Merda! — ele reclamou, levando a mão ao corpo. — Mas que porra é essa?!</p>

          <p>Antes que qualquer um pudesse reagir, um revólver surgiu à direita deles e disparou. Mas o que saiu do cano não tinha nada de ameaçador no sentido convencional. Em vez de uma bala, explodiram confetes coloridos, acompanhados por uma bandeirinha ridícula, típica de um número de circo.</p>

          <p>Nela, lia-se em letras exageradas:</p>

          <i style="color: yellow;">TADAAAA! CUIDADO COM A CABEÇA!</i>

          <p>Os três ficaram paralisados, encarando a cena com uma expressão mista de confusão e incredulidade, tentnado entender quem diabos faria uma brincadeira dessas num ambiente tão pesado.</p>

          <p>— Que palhaçada é ess—</p>

          <p>Então, acima deles, uma bigorna gigantesca despencava, prestes a transformar crânios em massa amorfa de osso, nervo e sangue. O instinto falou mais alto e eles tentaram se mover, mas a distância era curta demais e o tempo inexistente. No último segundo, porém, a corda que sustentava o objeto atingiu o limite e segurou a queda, evitando o impacto fatal.</p>

          <p>Por um breve instante, os três suspiraram aliviados, acreditando ter escapado por pouco. Um erro grave. Antes que qualquer reação fosse possível, um taco de beisebol emergiu das sombras e atingiu suas cabeças com violência absurda. O golpe foi certeiro, tão forte que os três apagaram no mesmo instante, caindo no chão sem resistência, como marionetes abandonadas depois que os fios são cortados.</p>

          <div class="section-break"><span>░ ░ ░</span></div>

          <p>Michael abriu os olhos devagar. Seu corpo parecia não lhe pertencer, estava pesado, inerte, abandonado sobre o chão úmido. A superfície fria infiltrava-se por suas roupas, alcançando-lhe os ossos. Ele inspirou com dificuldade e imediatamente se arrependeu. O ar estava tomado por um odor nauseante que parecia instalar-se não só na pele, mas em seus pulmões: parecia sangue recente misturado a carne deteriorada.</p>

          <p>Michael piscou algumas vezes, forçando a visão a se ajustar à penumbra. À medida que os contornos se tornavam mais nítidos, ele percebeu que estava diante de algo que assemelhava-se a uma sala de tortura.</p>

          <p>Ganchos de metal pendiam das paredes em fileiras irregulares, alguns manchados, outros reluzentes. Instrumentos cortantes como facas, serras e lâminas improvisadas encontravam-se dispostos sobre uma bancada, curiosamente alinhados, tornando aquele, ironicamente, o único ponto do cômodo que obedecia a alguma lógica. No centro do espaço, fantasias cômicas e desgastadas jaziam espalhadas pelo chão: tecidos coloridos, perucas sintéticas, pedaços de figurinos grotescos, abandonados com a pressa típica de quem interrompe algo às pressas.</p>

          <p>O pânico irrompeu no peito de Michael. Ele tentou erguer-se, mas os músculos responderam com atraso. Ele arrastou-se primeiro, apoiando-se nos cotovelos, sentindo o chão raspar contra a pele.</p>

          <p>Ele viu que Andy e Gregore estavam a poucos metros dali, presos a estruturas metálicas fixadas à parede. Correntes espessas envolviam-lhes os torsos e os braços, entrelaçadas com arame farpado que se cravava em suas carnes a cada movimento. Fita isolante selava-lhes a boca, abafando gritos que, ainda assim, escapavam em sons guturais e desesperados. Eles se contorciam, tentando libertar-se. Cada tentativa resultava em novos cortes e novas marcas vermelhas abrindo-se na pele.</p>

          <p>E, com um esforço quase sobre-humano, Michael começou a se arrastar em direção aos dois. Seu corpo protestava a cada centímetro percorrido.</p>

          <p>— P-Porra, aguentem firme! Eu vou tentar.. ahhh! T-Tirar vocês daqui..! — — disse Michael com a voz falhando.</p>

          <p>A frase fragmentava-se em gemidos. Ele segurava o pé machucado com uma das mãos, tentando conter a dor enquanto continuava avançando com a outra. Sua respiração agora vinha de forma quase convulsiva.</p>

          <p>O pé de Michael estava quebrado.</p>

          <p>Seu membro apresentava um ângulo antinatural, e o sangue escorria em fluxo contínuo, espalhando-se pelo chão já imundo. Michael não sabia ao certo como aquilo havia acontecido, se fora consequência de uma queda durante o apagão, se resultara de alguma agressão direta. Sua memória agora era apenas um bloco fragmentado, inconsistente. Mas havia uma única certeza ainda presente nela: permanecer imóvel significava aceitar o fim.</p>

          <p>Ele precisava agir.</p>

          <p>Com a visão turva e a respiração instável, girou a cabeça lentamente e vasculhou o ambiente. Foi então que notou, a poucos metros, um machado apoiado contra a parede. A lâmina refletia a luz fraca do recinto com uma frieza quase irônica, como se aguardasse utilização.</p>

          <p>— Tá… ótimo… — murmurou, mais para si do que para os outros.</p>

          <p>Michael reuniu o que restava de energia e começou a arrastar o próprio corpo até a ferramenta. Cada movimento era acompanhado por um gemido involuntário. O pé fraturado deixava um rastro escuro pelo trajeto. Mas, ainda assim, ele avançou. Ao alcançar o machado, ele agarrou-o com dificuldade. Suas mãos tremiam, levantar estava fora de questão, então ergueu a lâmina da maneira que conseguiu e golpeou as correntes que prendiam Andy primeiro.</p>

          <p>Um segundo golpe.</p>

          <p>Depois um terceiro.</p>

          <p>O metal cedeu.</p>

          <p>Em seguida, repetiu o processo com Gregore. O som da lâmina contra o ferro ecoava seco, urgente. Finalmente, as correntes se romperam. Eles estavam livres.</p>

          <p>Andy e Gregore afastaram-se dos arames farpados com movimentos cautelosos, suas peles estavam marcadas por cortes superficiais. Michael, porém, não conseguiu sustentar-se. A força que o mantinha ativo evaporou-se subitamente. O machado escapou-lhe dos dedos, e ele deixou o corpo deslizar até a parede rachada, apoiando-se nela enquanto tentava respirar, pois o ar parecia insuficiente.</p>

          <p>— Meu Deus, cara! Segura firme! — disse Andy, ajoelhando-se ao lado dele. — Teu pé tá todo fodido!</p>

          <p>Tentou aproximar a mão do ferimento, mas Michael reagiu instintivamente, afastando-o com um soco fraco.</p>

          <p>— Não toca, por—</p>

          <i style="color: rgb(134, 4, 4);">BANG!</i>

          <p>Um disparo interrompeu a frase.</p>

          <p>Por um segundo, ninguém compreendeu o que havia acontecido. Então a cabeça de Michael inclinou-se levemente para trás. Um orifício limpo abriu-se em sua testa, e o olhar, antes turvo pela dor, tornou-se vazio de imediato.</p>

          <p>Michael estava morto.</p>

          <p>Andy e Gregore permaneceram imóveis, como se o cérebro recusasse processar aquela informação. Em seguida, o choque converteu-se em gritos agudos, desordenados e impregnados de terror.</p>

          <p>Eles se viraram lentamente na direção de onde partira o disparo, e então o viram: Mr. Clown. Seu traje manchado, a máscara reconstruída por sombras, o sorriso permanente desenhado no rosto artificial. Segurava a arma com aparente tranquilidade. Havia sangue seco espalhado pelo figurino, mas nenhum sinal de fraqueza.</p>

          <p>Ele abaixou o revólver com lentidão, inclinando a cabeça para o lado. Em seguida, encenou uma expressão exagerada de surpresa, levando a mão livre à máscara como quem acaba de cometer um deslize trivial.</p>

          <p>— … Ooops! — disse, num tom infantil. — O amiguinho de vocês esqueceu que ainda tinha uma balinha sobrando!</p>

          <p>O palhaço riu. Um riso leve, descontraído, deslocado da brutalidade do momento.</p>

          <p>— Escorregooooou! — completou, alongando a palavra como se estivesse em um espetáculo circense.</p>

          <p>A gargalhada do palhaço espalhou-se pelo recinto com uma leveza grotesca, contrastando brutalmente com o cadáver ainda quente no chão. Ele saltitava de um lado para o outro, num simulacro infantil de animação, enquanto as botas pesadas produziam impactos surdos no concreto úmido.</p>

          <p>Gregore permanecia imóvel, seus olhos estavam arregalados e sua mente tentava organizar o que via. Mas a lógica falhava. Ele havia assistido aos disparos. Tinha visto o corpo cair. Aquilo não fazia sentido.</p>

          <p>Andy, ao contrário, reagiu com explosão.</p>

          <p>— Como você não morreu?! — bradou, a voz trincada por uma mistura caótica de raiva, pavor e incredulidade. — Eu acertei você várias vezes!</p>

          <p>— Haha! Acertou mesmo! — respondeu o palhaço, dando de ombros com teatral despreocupação. — Foi uma chuva bonita de balas, inclusive. Confesso que deu um sustinho no palhaço, mas eu também sou cheio de truques!</p>

          <p>A palavra “truques” saiu alongada, acompanhada de um gesto exagerado com as mãos, como se estivesse diante de uma plateia. Ele riu novamente, mas agora modulando a voz de modo estranho, arrastando sílabas, tornando o timbre mais grave e depois agudo demais. O efeito não era cômico; era perturbador. Soava como algo que não deveria sair de uma garganta humana.</p>

          <p>Sem pressa, o palhaço inclinou-se e recolheu o machado que Michael havia utilizado momentos antes. A lâmina ainda estava manchada. O palhaço a observou por um instante, e então passou o polegar pelo fio com intimidade.</p>

          <p>O palhaço deu um passo a frente.</p>

          <p>Andy e Gregore recuaram instintivamente.</p>

          <p>Outro passo, e o espaço entre eles diminuía.</p>

          <p>— Agora.. — começou ele, erguendo o machado com leveza inesperada. — …vem a minha parte favorita!</p>

          <p>O palhaço girou o cabo nos dedos como quem manipula um bastão de espetáculo.</p>

          <p>— Fazer hambúrgueres!</p>

          <p>A frase foi dita com entusiasmo genuíno. Andy e Gregore ergueram os braços numa postura defensiva inútil, conscientes de que aquilo não alteraria o desfecho. Era um reflexo primitivo, não mais uma estratégia. O corpo tenta lutar mesmo quando a mente já compreendeu.</p>

          <p>O palhaço passou a língua pelos lábios por baixo da máscara, um gesto insinuado pelo movimento da mandíbula. Em seguida, avançou. Os gritos que se seguiram atravessaram a casa como lâminas sonoras. Eram pedidos de socorro apenas na entonação, pois ninguém os ouviria. Muito menos responderia.</p>

          <p>Para Mr. Clown, porém, aqueles sons assumiam outro significado. Ele movia-se com energia festiva, como se estivesse no centro de um palco iluminado, recebendo aclamações. </p>

          <p>Cada súplica, cada berro de dor, transformava-se em um aplauso imaginário.</p>

          <p>O palhaço, agora afastado o suficiente da própria casa, permanecia oculto entre arbustos densos e árvores altas demais para serem contadas. Aquele canto esquecido do mundo funcionava melhor do que qualquer abrigo improvisado: ali, o silêncio abafava os pensamentos, e a escuridão era uma cúmplice. Muito além de um esconderijo, era o seu refúgio pessoal depois de um dia longo, cansativo e, acima de tudo, satisfatório.</p>

          <p>Por um tempo, ele chegou a acreditar que havia perdido o jeito. Que os instintos tinham enferrujado, que as mãos já não obedeciam com a mesma precisão de antes. Afinal, ficara adormecido por uma década inteira. Dez anos completos sufocando impulsos, engolindo a própria natureza, escondendo-se atrás de uma máscara humana mal-ajambrada. Um sorriso treinado, educado demais. Gestos gentis ensaiados até não parecerem falsos. Levou anos para aprender a fingir empatia sem deixar escapar o que realmente habitava por trás do olhar.</p>

          <p>Com um sorriso torto se formando no rosto, o palhaço lembrou-se do instante exato em que tudo saiu dos trilhos de vez. O momento em que a linha tênue entre controle e rendição se rompeu. Aconteceu durante uma de suas tantas apresentações circenses, sob luzes artificiais e risadas alheias.</p>

          <p>Apesar de todo o esforço, ele jamais conseguiu se equiparar às outras atrações. Sempre tropeçava em si mesmo, errava o tempo, exagerava no gesto errado. Os deslizes rendiam gargalhadas, é verdade, mas nunca de admiração, eram risos tortos, carregados de deboche. E não parava por aí. Objetos arremessados do público cruzavam o ar e acertavam seu corpo, como se aquilo fizesse parte do espetáculo. O ponto de ruptura, no entanto, foram os xingamentos. As palavras cuspidas por aquelas crianças, cruéis demais para bocas tão jovens, ecoaram nele por muito mais tempo do que qualquer aplauso jamais ecoaria.</p>

          <p>Ele se lembrava de cada rosto, guardava essas feições na memória e as guardaria para sempre, assim como jamais esqueceu o dia em que decidiu ensinar-lhes uma lição. Nunca mais foram encontradas. O palhaço não dominava apenas a arte de desaparecer sem deixar rastros, era igualmente habilidoso em esconder aquilo que considerava seus troféus.</p>

          <p>No fundo, ele sabia: tinha dado a elas exatamente o que mereciam.</p>

          <p>O sol começava a despontar no horizonte, tingindo o céu com tons de laranja intensos, belos o suficiente para parecerem irreais. Encostado em uma árvore, sentado de maneira relaxada, o palhaço segurava dois hambúrgueres nas mãos. Seu olhar fixava-se neles com um brilho obsessivo. Por um instante, percebeu que havia se esquecido daquele sabor específico, da explosão única que apenas o seu método de preparo era capaz de produzir. Era um prazer singular, bruto e reconfortante, algo que nenhuma outra iguaria no mundo conseguia sequer imitar.</p>

          <p>Então, o palhaço retirou a máscara e a deixou repousando ao seu lado apenas por um instante. Charlotte levou um dos hambúrgueres à boca e deu uma mordida contida. Ela mastigou devagar, permitindo que cada sabor se revelasse no tempo certo, analisando texturas, aromas, memórias.</p>

          <p>Um sorriso satisfeito surgiu em seus lábios. O hambúrguer estava perfeito, como sempre. Ela terminou os dois em poucos minutos. Rápido demais, talvez. Ao encarar os restos espalhados no chão, sentiu um vazio incômodo.</p>

          <p>Aquilo não bastava.</p>

          <p>Aproximavam-se de sua casa com olhares duros e postura confiante demais para quem não sabia exatamente onde estava pisando. Era uma cena familiar de assistir. Eram como eles, movidos pela mesma curiosidade estúpida: confirmar se o Mr. Clown era apenas uma história mal contada ou algo bem mais real.</p>

          <p>Charlotte sorriu.</p>

          <p>Pegou a máscara, levou-a ao rosto e a ajustou com cuidado, como quem retorna ao próprio lar.</p>

          <p>Mais um espetáculo estava prestes a começar naquela manhã.</p>
